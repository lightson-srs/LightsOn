<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Booking Request</title>
  <style>
    :root {
      --bg: #0f0f1a; --surface: #1a1a2e; --card: #22223b; --card2: #2d2d4e;
      --border: rgba(255,255,255,0.08); --text: #f0f0f5; --muted: #8888aa;
      --accent: #4a8fff; --amber: #f0a030; --red: #e05050; --green: #40c080;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    .header { background: var(--surface); padding: 8px 12px; text-align: center; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .header h1 { font-size: 14px; font-weight: 600; }
    .header p  { font-size: 10px; color: var(--muted); margin-top: 1px; }

    /* Single-screen grid: rooms as columns, the next 24 hours as rows — every
       row/cell sizes itself (flex) to fit the viewport with no scrolling. */
    .grid-wrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 4px 6px; }
    .grid-table { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .grid-header-row { display: flex; flex-shrink: 0; padding-bottom: 2px; }
    .grid-row { display: flex; flex: 1 1 0; min-height: 0; }
    .grid-cell-label { width: 42px; flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 5px; font-size: 10px; color: var(--muted); font-family: monospace; }
    .grid-room-header { flex: 1; min-width: 0; text-align: center; font-size: 10px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: 0.02em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 2px; }
    .grid-cell { flex: 1; min-width: 0; margin: 1px; border-radius: 4px; }
    .grid-cell.free { background: rgba(64,192,128,0.28); cursor: pointer; }
    .grid-cell.free:active { background: rgba(64,192,128,0.5); }
    .grid-cell.taken { background: rgba(255,255,255,0.05); }
    .grid-daysplit { border-top: 2px solid var(--accent); }
    .no-slots { text-align: center; padding: 24px 20px; color: var(--muted); font-size: 13px; }

    /* Name/phone form overlay — same bottom-sheet pattern as the PIN pad */
    .form-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: flex-end; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .form-overlay.show { opacity: 1; pointer-events: all; }
    .form-panel { background: var(--surface); border-radius: 20px 20px 0 0; padding: 20px 20px 28px; width: 100%; max-width: 480px; }
    .form-title { text-align: center; font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .form-sub   { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 18px; }
    .form-field { margin-bottom: 14px; }
    .form-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .form-field input { width: 100%; padding: 14px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 16px; }
    .form-field input:focus { outline: none; border-color: var(--accent); }
    .form-error { text-align: center; font-size: 13px; color: var(--red); margin-top: 4px; min-height: 18px; }
    .form-submit { width: 100%; padding: 16px; border-radius: var(--radius); border: none; background: var(--accent); color: white; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 4px; }
    .form-submit:active { opacity: 0.85; }
    .form-cancel { width: 100%; padding: 12px; margin-top: 10px; border-radius: var(--radius); border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 14px; cursor: pointer; }

    /* Loading */
    .loading { text-align: center; padding: 60px 20px; color: var(--muted); }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Success flash */
    .success-overlay { position: fixed; inset: 0; background: rgba(64,192,128,0.15); display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .success-overlay.show { opacity: 1; }
    .success-box { background: var(--card); border-radius: var(--radius); padding: 32px; text-align: center; border: 1px solid var(--green); }
    .success-icon { font-size: 48px; margin-bottom: 12px; }
    .success-text { font-size: 18px; font-weight: 600; color: var(--green); }
    .success-sub  { font-size: 13px; color: var(--muted); margin-top: 6px; }
    .product-info-footer { text-align: center; font-size: 9px; color: var(--muted); padding: 3px 8px; line-height: 1.3; flex-shrink: 0; }
    .product-info-footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>

<div class="header">
  <h1><span id="profileName"></span>Request a Booking</h1>
  <p id="headerDate"></p>
</div>

<div class="grid-wrap">
  <div class="loading" id="loadingState">
    <div class="spinner"></div>
    Loading available slots…
  </div>
  <div class="grid-table" id="gridContainer" style="display:none"></div>
</div>

<div class="product-info-footer" id="productInfoFooter"></div>

<!-- Name / phone form overlay -->
<div class="form-overlay" id="formOverlay">
  <div class="form-panel">
    <div class="form-title">Request this slot</div>
    <div class="form-sub" id="formSub"></div>
    <div class="form-field">
      <label for="reqName">Your name</label>
      <input type="text" id="reqName" placeholder="e.g. Arjun" autocomplete="name">
    </div>
    <div class="form-field">
      <label for="reqPhone">Mobile number</label>
      <input type="tel" id="reqPhone" placeholder="10-digit mobile number" autocomplete="tel" inputmode="numeric">
    </div>
    <div class="form-error" id="formError"></div>
    <button class="form-submit" onclick="submitRequest()">Send request</button>
    <button class="form-cancel" onclick="closeForm()">Cancel</button>
  </div>
</div>

<!-- Success overlay -->
<div class="success-overlay" id="successOverlay">
  <div class="success-box">
    <div class="success-icon">✅</div>
    <div class="success-text">Request sent!</div>
    <div class="success-sub" id="successSub"></div>
  </div>
</div>

<script src="product-info.js"></script>
<script>
document.getElementById('productInfoFooter').innerHTML = productInfoHtml();

// ── Config — supplied via ?db=&p= baked into each profile's QR code ────
const FIREBASE_URL   = new URLSearchParams(location.search).get('db') || '';
const PROFILE_NUM    = new URLSearchParams(location.search).get('p') || '';
const PROFILE_PREFIX = PROFILE_NUM ? '/profiles/' + PROFILE_NUM : '';

// ── State ─────────────────────────────────────────────────────
let allRooms = [];       // [{id, name, options:[{date, dayIdx, s, e}]}]
let selectedOption = null;
let loadingSlots = false;

// ── Helpers ───────────────────────────────────────────────────
function toMins(t) { const [h,m]=t.split(':').map(Number); return h*60+m; }
function minsToTimeStr(m) { return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); }

function nowMins() {
  const n = new Date(); return n.getHours()*60 + n.getMinutes();
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function tomorrowStr() {
  const d = new Date(); d.setDate(d.getDate()+1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// ── Firebase REST — same minimal helpers as activate.html ──────
async function fbGet(path) {
  try {
    const url = FIREBASE_URL + PROFILE_PREFIX + path + '.json?nc=' + Date.now();
    const res = await fetch(url, { cache: 'no-store', headers: { 'Accept': 'application/json' } });
    if (!res.ok) return null;
    return await res.json();
  } catch(e) { return null; }
}
async function fbPut(path, value) {
  try {
    await fetch(FIREBASE_URL + PROFILE_PREFIX + path + '.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(value)
    });
    return true;
  } catch(e) { return false; }
}

function makeRequestId() {
  return 'req_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function normalizeArr(v) {
  if (!v) return [];
  if (Array.isArray(v)) return v;
  return Object.keys(v).sort((a,b)=>parseInt(a)-parseInt(b)).map(k => v[k]);
}

// ── Load rooms + compute per-hour occupancy for today/tomorrow ──
// Same occupancy scan the admin's own slot-add grid uses (renderGridOccupancy
// in index.html) — occ[i]=true means hour block i is taken.
function showGridError(msg) {
  document.getElementById('loadingState').style.display = 'none';
  const c = document.getElementById('gridContainer');
  c.style.display = 'flex';
  c.innerHTML = `<div class="no-slots">${msg}</div>`;
}

async function loadAvailability() {
  if (!FIREBASE_URL || !PROFILE_NUM) {
    showGridError(`This booking link is missing its configuration.<br>
      <span style="font-size:11px;color:var(--muted);margin-top:6px;display:block">
        Please re-scan the QR code from the ${PRODUCT_INFO.name} dashboard.
      </span>`);
    return;
  }
  if (loadingSlots) return;
  loadingSlots = true;

  try {
    const rooms = await fbGet('/rooms');
    if (!rooms) { showGridError('Could not connect to Firebase.<br>Check your internet connection.'); return; }

    const todayWd = new Date().getDay();
    const tomorrowWd = (todayWd + 1) % 7;
    const roomKeys = Object.keys(rooms).sort();
    const newAllRooms = [];

    // Build a 24-slot occupied[] array per day the same way the admin's
    // slot-add grid does (renderGridOccupancy) — occ[i] true if hour block i
    // overlaps an existing slot (respecting recurring day-gating).
    const buildOccupied = (slots, weekday) => {
      const occ = new Array(24).fill(false);
      normalizeArr(slots).forEach(sl => {
        if (!sl || !sl.s || !sl.e) return;
        if (sl.recurring && Array.isArray(sl.days) && sl.days.length && !sl.days.includes(weekday)) return;
        const si = Math.floor(toMins(sl.s) / 60);
        const ei = Math.ceil(toMins(sl.e) / 60);
        for (let i = Math.max(0, si); i < Math.min(24, ei); i++) occ[i] = true;
      });
      return occ;
    };

    for (const key of roomKeys) {
      const room = rooms[key];
      const roomId = parseInt(key.replace('room', ''));
      newAllRooms.push({
        id: roomId,
        name: room.name || key,
        occToday: buildOccupied(room.slots, todayWd),
        occTomorrow: buildOccupied(room.slotsT, tomorrowWd)
      });
    }

    allRooms = newAllRooms;
    document.getElementById('loadingState').style.display = 'none';
    renderGrid();
  } catch(e) {
    showGridError('Error loading availability. Please refresh the page.');
  } finally {
    loadingSlots = false;
  }
}

// Single-screen grid: rooms as columns, the next 24 hours (starting at the
// next full hour — the current, partially-elapsed hour is never offered) as
// rows, rolling from today into tomorrow. Every row is an equal flex share
// of the remaining viewport height, so this fits without scrolling on a
// typical phone regardless of exact screen size.
function renderGrid() {
  const container = document.getElementById('gridContainer');
  container.style.display = 'flex';

  if (allRooms.length === 0) {
    container.style.display = 'block';
    container.innerHTML = `<div class="no-slots">No rooms configured yet.</div>`;
    return;
  }

  const startHour = Math.floor(nowMins() / 60) + 1; // next full hour — "today" if <24, else wraps into tomorrow
  let sawDaySplit = false;

  const headerRow = `<div class="grid-header-row"><div class="grid-cell-label"></div>` +
    allRooms.map(r => `<div class="grid-room-header">${r.name}</div>`).join('') + `</div>`;

  let rows = '';
  for (let i = 0; i < 24; i++) {
    const abs = startHour + i;
    const hourOfDay = abs % 24;
    const dayIdx = abs >= 24 ? 1 : 0;
    const isSplit = dayIdx === 1 && !sawDaySplit;
    if (isSplit) sawDaySplit = true;
    const label = String(hourOfDay).padStart(2, '0');
    rows += `<div class="grid-row${isSplit ? ' grid-daysplit' : ''}"><div class="grid-cell-label">${label}</div>` +
      allRooms.map(room => {
        const occ = dayIdx === 0 ? room.occToday : room.occTomorrow;
        const free = !occ[hourOfDay];
        const onclick = free ? ` onclick="selectGridCell(${room.id}, ${dayIdx}, ${hourOfDay})"` : '';
        return `<div class="grid-cell ${free ? 'free' : 'taken'}"${onclick}></div>`;
      }).join('') +
      `</div>`;
  }

  container.innerHTML = headerRow + rows;
}

// ── Tap a free cell → show name/phone form ─────────────────────
function selectGridCell(roomId, dayIdx, hourOfDay) {
  const room = allRooms.find(r => r.id === roomId);
  if (!room) return;
  const s = minsToTimeStr(hourOfDay * 60);
  const e = minsToTimeStr((hourOfDay + 1) * 60);
  const opt = { dayIdx, date: dayIdx === 0 ? todayStr() : tomorrowStr(), s, e, label: dayIdx === 0 ? 'Today' : 'Tomorrow' };
  selectedOption = { room, opt };
  document.getElementById('reqName').value = '';
  document.getElementById('reqPhone').value = '';
  document.getElementById('formError').textContent = '';
  document.getElementById('formSub').textContent = `${room.name} · ${opt.s} – ${opt.e} (${opt.label})`;
  document.getElementById('formOverlay').classList.add('show');
}

function closeForm() {
  document.getElementById('formOverlay').classList.remove('show');
  selectedOption = null;
}

function makeSlotId() {
  return 'sl_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function generate4DigitCode() {
  return String(Math.floor(1000 + Math.random() * 9000));
}

// Once a specific room+date+time is booked, every OTHER still-open request
// for that exact same slot can never be honoured — decline them so they
// don't linger looking actionable in the admin's Requests tab. Mirrors
// index.html's declineSiblingRequests; duplicated here (rather than shared)
// since this page has no access to index.html's fbPatch helper — merges the
// change onto the full fetched object itself before writing it back with
// fbPut (a plain PUT, unlike fbPatch, replaces the whole node).
async function declineSiblingRequestsPublic(confirmedReq, excludeId) {
  const data = await fbGet('/requests');
  if (!data || typeof data !== 'object') return;
  const jobs = Object.keys(data)
    .filter(rid => rid !== excludeId)
    .filter(rid => {
      const r = data[rid];
      return r && r.status !== 'confirmed' && r.status !== 'declined' &&
        r.roomId === confirmedReq.roomId && r.date === confirmedReq.date &&
        r.s === confirmedReq.s && r.e === confirmedReq.e;
    })
    .map(rid => fbPut('/requests/' + rid, { ...data[rid], status: 'declined', declinedAt: Date.now(), declinedReason: 'slot_taken' }));
  await Promise.all(jobs);
}

// Called only when /config/autoApproveBookings is true. Re-checks
// availability right before writing (someone may have booked this exact
// time in the moments since the page loaded), then creates the slot at a
// fresh index — a targeted single-index PUT, never a wholesale overwrite of
// the whole bucket, so it can never clobber a slot something else just
// added to the same room. Returns true if it actually booked the slot;
// false if the slot turned out to already be taken (request is declined
// in that case, not left dangling as "open").
async function tryAutoApprove(id, room, opt, reqObj) {
  const bucketPath = '/rooms/room' + room.id + (opt.dayIdx === 0 ? '/slots' : '/slotsT');
  const arr = normalizeArr(await fbGet(bucketPath));
  const collision = arr.some(sl => sl && sl.s === opt.s && sl.e === opt.e);
  if (collision) {
    await fbPut('/requests/' + id, { ...reqObj, status: 'declined', declinedAt: Date.now(), declinedReason: 'slot_taken' });
    return false;
  }

  const newSlot = {
    id: makeSlotId(),
    s: opt.s, e: opt.e, recurring: false,
    code: generate4DigitCode(),
    paid: false,
    activatedAt: null, activatedBy: null, attempts: 0, lockedUntil: null, expired: false,
    date: opt.date,
    bookedBy: reqObj.name, phone: reqObj.phone,
    slotTs: Date.now()
  };
  const ok = await fbPut(bucketPath + '/' + arr.length, newSlot);
  if (!ok) return false;

  await fbPut('/requests/' + id, {
    ...reqObj, status: 'confirmed', confirmedAt: Date.now(),
    confirmedRoomId: room.id, confirmedSlotId: newSlot.id
  });
  await declineSiblingRequestsPublic(reqObj, id);
  return true;
}

async function submitRequest() {
  if (!selectedOption) return;
  const name  = document.getElementById('reqName').value.trim();
  const phone = document.getElementById('reqPhone').value.trim();
  if (!name) { document.getElementById('formError').textContent = 'Please enter your name'; return; }
  if (!/^\d{7,15}$/.test(phone.replace(/[^\d]/g, ''))) {
    document.getElementById('formError').textContent = 'Please enter a valid mobile number';
    return;
  }

  const { room, opt } = selectedOption;
  const id = makeRequestId();
  const reqObj = {
    roomId: room.id,
    roomName: room.name,
    date: opt.date,
    dayIdx: opt.dayIdx,
    s: opt.s,
    e: opt.e,
    name,
    phone: phone.replace(/[^\d]/g, ''),
    status: 'open',
    createdAt: Date.now()
  };
  const ok = await fbPut('/requests/' + id, reqObj);

  if (!ok) {
    document.getElementById('formError').textContent = 'Network error — please try again';
    return;
  }

  document.getElementById('formOverlay').classList.remove('show');

  // Auto-approve: try to confirm immediately. If the slot turned out to
  // already be taken, tell the visitor instead of showing a false success
  // and refresh the list so they can pick something else.
  const autoApprove = await fbGet('/config/autoApproveBookings');
  if (autoApprove === true) {
    const booked = await tryAutoApprove(id, room, opt, reqObj);
    if (!booked) {
      showGridError(`Sorry — that slot was just taken by someone else.<br>
        <span style="font-size:11px;color:var(--muted);margin-top:6px;display:block">Refreshing availability…</span>`);
      setTimeout(loadAvailability, 1500);
      return;
    }
    document.getElementById('successSub').textContent =
      `${room.name} · ${opt.s} – ${opt.e} (${opt.label}) — code required at the room`;
    document.getElementById('successOverlay').querySelector('.success-text').textContent = 'Booking confirmed!';
  } else {
    document.getElementById('successSub').textContent =
      `${room.name} · ${opt.s} – ${opt.e} (${opt.label})`;
    document.getElementById('successOverlay').querySelector('.success-text').textContent = 'Request sent!';
  }

  document.getElementById('successOverlay').classList.add('show');
  setTimeout(() => {
    document.getElementById('successOverlay').classList.remove('show');
    closePage('submitted');
  }, 4000);
}

// ── Boot ──────────────────────────────────────────────────────
document.getElementById('headerDate').textContent =
  new Date().toLocaleDateString([], { weekday:'long', month:'long', day:'numeric' });

// ── Auto-close (lifetime + idle) — same pattern as activate.html ────────
// This page is meant to be short-lived too: 3 minutes idle, or a generous
// 10-minute hard cap regardless of activity. Browsers only allow a
// script-initiated window.close() on a tab the script itself opened; most
// QR scanners hand the link to the OS, which opens a normal tab, so
// window.close() silently no-ops there — replace the page with a "you can
// close this tab" message in that case instead of leaving the UI open.
const MAX_LIFETIME_MS = 10 * 60 * 1000; // hard cap: 10 minutes
const IDLE_TIMEOUT_MS = 3 * 60 * 1000;  // idle cap: 3 minutes (the actual close condition in practice)
let pageClosed = false;

function closePage(reason) {
  if (pageClosed) return;
  pageClosed = true;
  if (idleTimer) clearTimeout(idleTimer);
  if (lifetimeTimer) clearTimeout(lifetimeTimer);

  window.close();

  setTimeout(() => {
    document.body.innerHTML =
      '<div style="min-height:100vh;display:flex;flex-direction:column;' +
      'align-items:center;justify-content:center;text-align:center;padding:24px;' +
      'font-family:system-ui,-apple-system,sans-serif;color:#888;gap:12px;"' + '>' +
      '<div style="font-size:40px">👋</div>' +
      '<div style="font-size:16px">' +
      (reason === 'submitted' ? 'Request sent.' : 'Session timed out.') +
      '</div>' +
      '<div style="font-size:13px">You can close this tab now.</div>' +
      '</div>';
  }, 300);
}

let lifetimeTimer = setTimeout(() => closePage('timeout'), MAX_LIFETIME_MS);
let idleTimer = setTimeout(() => closePage('timeout'), IDLE_TIMEOUT_MS);
function resetIdleTimer() {
  if (pageClosed) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => closePage('timeout'), IDLE_TIMEOUT_MS);
}
['pointerdown', 'keydown', 'touchstart', 'click'].forEach(evt => {
  document.addEventListener(evt, resetIdleTimer, { passive: true });
});

if (FIREBASE_URL && PROFILE_NUM) {
  loadAvailability();
  // Full refresh every 15 seconds — keeps availability current if someone
  // else books a slot while this page is open.
  setInterval(() => { if (!document.getElementById('formOverlay').classList.contains('show')) loadAvailability(); }, 15000);
} else {
  loadAvailability(); // shows the "missing configuration" message
}
</script>
</body>
</html>
